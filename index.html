<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Rainbow After Rain - SHIN</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:'Poppins',sans-serif;
}

body{
    overflow:hidden;
    height:100vh;
    background:linear-gradient(to bottom,#1b2b52,#3f5c98,#89b7ff);
    position:relative;
}

/* MƯA */

.rain{
    position:absolute;
    width:2px;
    height:80px;
    background:rgba(255,255,255,0.5);
    animation:fall linear infinite;
}

@keyframes fall{
    0%{
        transform:translateY(-120px);
        opacity:1;
    }
    100%{
        transform:translateY(120vh);
        opacity:0;
    }
}

/* MÂY */

.cloud{
    position:absolute;
    width:220px;
    height:80px;
    background:rgba(255,255,255,0.85);
    border-radius:100px;
    animation:cloudMove 18s linear infinite;
}

.cloud::before,
.cloud::after{
    content:'';
    position:absolute;
    background:white;
    border-radius:50%;
}

.cloud::before{
    width:90px;
    height:90px;
    top:-45px;
    left:35px;
}

.cloud::after{
    width:120px;
    height:120px;
    top:-60px;
    right:30px;
}

.cloud1{
    top:60px;
    animation-duration:22s;
}

.cloud2{
    top:140px;
    width:180px;
    animation-duration:30s;
    animation-delay:-10s;
}

@keyframes cloudMove{
    0%{
        transform:translateX(-300px);
    }
    100%{
        transform:translateX(130vw);
    }
}

/* CẦU VỒNG */

.rainbow{
    position:absolute;
    bottom:-120px;
    left:50%;
    transform:translateX(-50%) scale(0);
    width:720px;
    height:360px;
    border-radius:360px 360px 0 0;
    border-top:20px solid #ff3b3b;
    border-left:20px solid #ff3b3b;
    border-right:20px solid #ff3b3b;
    animation:rainbowAppear 5s ease forwards;
    animation-delay:5s;
    opacity:0;
}

.rainbow::before,
.rainbow::after{
    content:'';
    position:absolute;
    left:50%;
    transform:translateX(-50%);
    border-radius:350px 350px 0 0;
}

.rainbow::before{
    width:650px;
    height:325px;
    top:18px;
    border-top:20px solid #ff9f1c;
    border-left:20px solid #ff9f1c;
    border-right:20px solid #ff9f1c;
}

.rainbow::after{
    width:580px;
    height:290px;
    top:36px;
    border-top:20px solid #ffe600;
    border-left:20px solid #ffe600;
    border-right:20px solid #ffe600;
}

.rainbow-inner{
    position:absolute;
    left:50%;
    transform:translateX(-50%);
    top:54px;
    width:510px;
    height:255px;
    border-radius:255px 255px 0 0;
    border-top:20px solid #2dff7a;
    border-left:20px solid #2dff7a;
    border-right:20px solid #2dff7a;
}

.rainbow-inner::before,
.rainbow-inner::after{
    content:'';
    position:absolute;
    left:50%;
    transform:translateX(-50%);
    border-radius:250px 250px 0 0;
}

.rainbow-inner::before{
    width:440px;
    height:220px;
    top:18px;
    border-top:20px solid #00b7ff;
    border-left:20px solid #00b7ff;
    border-right:20px solid #00b7ff;
}

.rainbow-inner::after{
    width:370px;
    height:185px;
    top:36px;
    border-top:20px solid #8b5cf6;
    border-left:20px solid #8b5cf6;
    border-right:20px solid #8b5cf6;
}

@keyframes rainbowAppear{
    0%{
        transform:translateX(-50%) scale(0.2);
        opacity:0;
    }
    100%{
        transform:translateX(-50%) scale(1);
        opacity:1;
    }
}

/* CONTENT */

.content{
    position:absolute;
    top:50%;
    left:50%;
    transform:translate(-50%,-50%);
    text-align:center;
    color:white;
    z-index:10;
}

.content h1{
    font-size:70px;
    letter-spacing:4px;
    text-shadow:0 0 25px rgba(255,255,255,0.8);
}

.content p{
    margin-top:18px;
    font-size:22px;
}

/* MESSAGE BOX */

.message-box{
    margin-top:35px;
    padding:18px 28px;
    background:rgba(255,255,255,0.12);
    border:1px solid rgba(255,255,255,0.25);
    border-radius:20px;
    backdrop-filter:blur(10px);
    min-width:500px;
    max-width:700px;
    animation:floatBox 4s ease-in-out infinite;
}

.message-text{
    font-size:22px;
    color:#ffd6e7;
    line-height:1.6;
    font-weight:bold;
}

@keyframes floatBox{
    0%,100%{
        transform:translateY(0);
    }
    50%{
        transform:translateY(-8px);
    }
}

/* HEART BUTTON */

.love-btn{
    margin-top:30px;
    width:80px;
    height:80px;
    border-radius:50%;
    border:none;
    cursor:pointer;
    font-size:38px;
    background:rgba(255,255,255,0.15);
    backdrop-filter:blur(10px);
    box-shadow:0 0 20px rgba(255,255,255,0.25);
    transition:0.3s;
    animation:pulseBtn 2s infinite;
}

.love-btn:hover{
    transform:scale(1.1);
}

@keyframes pulseBtn{
    0%,100%{
        transform:scale(1);
    }
    50%{
        transform:scale(1.08);
    }
}

/* HOA RƠI */

.rose{
    position:absolute;
    pointer-events:none;
    animation:fallRose linear forwards;
}

@keyframes fallRose{
    0%{
        transform:translateY(-50px) rotate(0deg);
        opacity:1;
    }
    100%{
        transform:translateY(110vh) rotate(360deg);
        opacity:0;
    }
}

/* LẤP LÁNH */

.shine{
    position:absolute;
    width:6px;
    height:6px;
    background:white;
    border-radius:50%;
    animation:sparkle 4s infinite;
}

@keyframes sparkle{
    0%,100%{
        transform:scale(0.5);
        opacity:0.2;
    }
    50%{
        transform:scale(1.8);
        opacity:1;
    }
}

</style>
</head>

<body>

<div class="cloud cloud1"></div>
<div class="cloud cloud2"></div>

<div class="content">

    <h1>NGUYỄN CẨM QUỲNH</h1>

    <p>"Sau cơn mưa, cầu vồng sẽ xuất hiện ✨"</p>

    <div style="font-size:40px;margin-top:20px;">
        🌈💖
    </div>

    <p style="margin-top:25px;font-size:18px;opacity:0.8;">
        Dành riêng cho SHIN 
    </p>
     <p style="margin-top:25px;font-size:18px;opacity:0.8;">
        (Ấn vào trái tim để thấy thêm điều bất ngờ nhé 💖)
    </p>

    <div class="message-box">
        <div class="message-text" id="messageText">
            SHIN luôn là điều đẹp đẽ nhất sau cơn mưa 🌈
        </div>
    </div>

    <button class="love-btn" onclick="createRoses()">
        💖
    </button>

</div>

<div class="rainbow">
    <div class="rainbow-inner"></div>
</div>

<script>

/* MƯA */

for(let i=0;i<120;i++){

    const rain=document.createElement('div');

    rain.classList.add('rain');

    rain.style.left=Math.random()*window.innerWidth+'px';

    rain.style.animationDuration=(Math.random()*1+0.5)+'s';

    rain.style.opacity=Math.random();

    rain.style.animationDelay=Math.random()*5+'s';

    document.body.appendChild(rain);
}

/* LẤP LÁNH */

for(let i=0;i<40;i++){

    const shine=document.createElement('div');

    shine.classList.add('shine');

    shine.style.left=Math.random()*window.innerWidth+'px';

    shine.style.top=Math.random()*window.innerHeight+'px';

    shine.style.animationDelay=Math.random()*4+'s';

    document.body.appendChild(shine);
}

/* DỪNG MƯA */

setTimeout(()=>{

    document.querySelectorAll('.rain').forEach(r=>{

        r.style.animationIterationCount='3';

    });

},4000);

/* MESSAGE */

const messages=[

'SHIN luôn là điều đẹp đẽ nhất sau cơn mưa 🌈',

'Nụ cười của SHIN làm mọi thứ trở nên dịu dàng hơn ✨',

'Cậu tuyệt vời hơn những gì cậu nghĩ rất nhiều 💖',

'Mỗi ngày của SHIN đều xứng đáng được hạnh phúc ☀️',

'SHIN giống như cầu vồng xuất hiện sau những ngày mệt mỏi 🌦️',

'Cậu mang lại cảm giác bình yên cho mọi người 🌸',

'Đừng quên rằng SHIN rất đặc biệt nhé 💫',

'Có những người chỉ cần xuất hiện thôi đã khiến thế giới đẹp hơn 🌷'

];

let current=0;

const messageText=document.getElementById('messageText');

setInterval(()=>{

    current=(current+1)%messages.length;

    messageText.innerHTML=messages[current];

},4000);

/* HOA HỒNG */

function createRoses(){

    for(let i=0;i<30;i++){

        const rose=document.createElement('div');

        rose.classList.add('rose');

        const flowers=['🌹','🌺','🌸','💖'];

        rose.innerHTML=flowers[Math.floor(Math.random()*flowers.length)];

        rose.style.left=Math.random()*window.innerWidth+'px';

        rose.style.top='-50px';

        rose.style.fontSize=(Math.random()*20+25)+'px';

        rose.style.animationDuration=(Math.random()*3+3)+'s';

        document.body.appendChild(rose);

        setTimeout(()=>{

            rose.remove();

        },7000);
    }
}

</script>

</body>
</html>
